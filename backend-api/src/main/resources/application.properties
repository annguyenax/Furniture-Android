# Application Configuration
spring.application.name=furniture-api
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/furniture_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT Configuration
# REQUIRED: Set JWT_SECRET env var in production (min 64 chars).
# Local dev: uses the default below — change before any deployment.
jwt.secret=${JWT_SECRET:bG9jYWwtZGV2LWp3dC1zZWNyZXQtY2hhbmdlLWJlZm9yZS1kZXBsb3ltZW50LW11c3QtYmUtNjRjaGFycw==}
jwt.access-token-expiration=7200000
jwt.refresh-token-expiration=604800000

# Cloudinary Configuration
# REQUIRED: Set CLOUDINARY_* env vars. See .env.example for variable names.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.frontend-url=${APP_FRONTEND_URL:furnitureapp://auth}
app.email.send-enabled=${APP_EMAIL_SEND_ENABLED:false}

# Google OAuth2 Configuration
google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id.apps.googleusercontent.com}
google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.furniture.api=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# SQL Init — disabled, DataInitializer.java handles seeding
spring.sql.init.mode=never
